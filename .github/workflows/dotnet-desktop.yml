name: .NET Core Desktop

on:
  push:
    branches: [ main, benefit ]
  pull_request:
    branches: [ main ]

concurrency:
  group: raidcrawler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  build:

    env:
      Configuration: 'Release'

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x

    - name: Restore the solution
      run: dotnet restore
    
    - name: Build all projects
      run: dotnet build --configuration $env:Configuration --no-restore

    - name: Reward editor tests (blocking)
      run: dotnet test RaidCrawler.Tests/RaidCrawler.Tests.csproj --configuration $env:Configuration --no-build --no-restore --filter 'FullyQualifiedName~RaidRewardEditorTests|FullyQualifiedName~PokeLdnHostPlanTests|FullyQualifiedName~ChineseGameStringsTests|FullyQualifiedName~RaidRewardPresetsTests|FullyQualifiedName~RaidPointOfflinePatchTests|FullyQualifiedName~RaidRewardItemCatalogTests|FullyQualifiedName~RaidRewardHookContractTests|FullyQualifiedName~RaidRewardGlobalProfileStoreTests|FullyQualifiedName~NativeRaidCodeFingerprintTests'

    - name: Existing raid baseline tests (nonblocking)
      continue-on-error: true
      run: dotnet test RaidCrawler.Tests/RaidCrawler.Tests.csproj --configuration $env:Configuration --no-build --no-restore

    - name: Publish
      run: |
        dotnet build --configuration $env:Configuration --no-restore
        dotnet publish -c $env:Configuration -r win-x64 --self-contained false

    - name: Archive production artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: RaidCrawler
        path: |
          ./RaidCrawler.WinForms/bin/x64/Release/net10.0-windows/win-x64/publish/

    - name: Publish independent benefit host preview release
      if: ${{ github.ref == 'refs/heads/benefit' && contains(github.event.head_commit.message, '[release-benefit]') }}
      env:
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: |
        $folder = "./RaidCrawler.WinForms/bin/x64/Release/net10.0-windows/win-x64/publish"
        if (!(Test-Path $folder)) { throw "Missing published WinForms directory" }
        $asset = "RaidCrawler-benefit-editor-v0.1.3-win-x64.zip"
        Compress-Archive -Path "$folder/*" -DestinationPath $asset -Force
        $tag = "benefit-editor-v0.1.3"
        $notes = "RaidCrawler benefit v0.1.3: PKHeX.Core 道具模糊搜索（中文、英文、ID）、45固定槽、默认20条999晶耀护符奖励、25空槽、底部四按钮、右键高级操作、JSON/BIN导入导出和当前计算奖励预览。包括基于《紫》4.0.0 ELF、PokéLDN、SV-Script-RE 的 Hook 数据契约研究。重要：Nintendo 官方互联网实时奖励写入尚未实现；写入按钮只执行预检，绝不修改Switch内存。"
        gh release view $tag --repo "${{ github.repository }}" *> $null
        if ($LASTEXITCODE -eq 0) {
          gh release upload $tag $asset --repo "${{ github.repository }}" --clobber
        } else {
          gh release create $tag $asset --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Benefit Editor v0.1.3 — 搜索道具与45槽预览版" --notes $notes --prerelease
        }
