name: .NET Core Desktop

on:
  push:
    branches: [ main, benefit ]
  pull_request:
    branches: [ main ]

concurrency:
  group: raidcrawler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  build:

    env:
      Configuration: 'Release'

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x

    - name: Restore the solution
      run: dotnet restore
    
    - name: Build all projects
      run: dotnet build --configuration $env:Configuration --no-restore

    - name: Reward editor tests (blocking)
      run: dotnet test RaidCrawler.Tests/RaidCrawler.Tests.csproj --configuration $env:Configuration --no-build --no-restore --filter 'FullyQualifiedName~RewardAppendComposerTests|FullyQualifiedName~CharmBonusProfileTests|FullyQualifiedName~RaidRewardEditorTests|FullyQualifiedName~PokeLdnHostPlanTests|FullyQualifiedName~ChineseGameStringsTests|FullyQualifiedName~RaidRewardPresetsTests|FullyQualifiedName~RaidPointOfflinePatchTests|FullyQualifiedName~RaidRewardItemCatalogTests|FullyQualifiedName~RaidRewardHookContractTests|FullyQualifiedName~RaidRewardGlobalProfileStoreTests|FullyQualifiedName~NativeRaidCodeFingerprintTests|FullyQualifiedName~RemoteHookCapabilitiesTests|FullyQualifiedName~RemoteRewardEpochUpdaterTests|FullyQualifiedName~RemoteRewardTemplateUpdatePolicyTests|FullyQualifiedName~RemoteInlineHookLifecycleTests|FullyQualifiedName~RemoteViolet400HookInstallerTests|FullyQualifiedName~RemoteCodeGapWriteProbeTests|FullyQualifiedName~RemoteHookIntegritySnapshotTests|FullyQualifiedName~RaidRewardTraceEvidenceTests|FullyQualifiedName~RaidRewardAbcEvidenceTests|FullyQualifiedName~RaidPhaseObservationMachineTests'

    - name: Existing raid baseline tests (nonblocking)
      continue-on-error: true
      run: dotnet test RaidCrawler.Tests/RaidCrawler.Tests.csproj --configuration $env:Configuration --no-build --no-restore

    - name: Publish
      run: |
        dotnet build --configuration $env:Configuration --no-restore
        dotnet publish -c $env:Configuration -r win-x64 --self-contained false

    - name: Archive production artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: RaidCrawler
        path: |
          ./RaidCrawler.WinForms/bin/x64/Release/net10.0-windows/win-x64/publish/

    - name: Publish independent benefit host preview release
      if: ${{ github.ref == 'refs/heads/benefit' && contains(github.event.head_commit.message, '[release-benefit]') }}
      env:
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: |
        $folder = "./RaidCrawler.WinForms/bin/x64/Release/net10.0-windows/win-x64/publish"
        if (!(Test-Path $folder)) { throw "Missing published WinForms directory" }
        $asset = "RaidCrawler-benefit-global-rewards-v0.1.5-win-x64.zip"
        Compress-Archive -Path "$folder/*" -DestinationPath $asset -Force
        $tag = "benefit-global-rewards-v0.1.5"
        $notes = "RaidCrawler benefit v0.1.5: The 45-slot reward template is GLOBAL across all Scarlet/Violet raids, maps, dens and seeds, available without selecting a den. Persists at LOCALAPPDATA/RaidCrawler/global-raid-rewards.json; defaults to 20 rows x999 Subject 5 and 25 empty slots. Supports fuzzy item searching and JSON/BIN. Write Rewards prepares the template and opens READ-ONLY console diagnostics. Violet 4.0.0 probes eight loaded serializer opcode anchors and records JSONL logs. Offline callback staging no longer requires any selected Seed or Internet mode. CRITICAL: Native Switch runtime Hook NOT installed; no live reward memory injection is implemented or claimed. Research/testing prerelease."
        gh release view $tag --repo "${{ github.repository }}" *> $null
        if ($LASTEXITCODE -eq 0) {
          gh release upload $tag $asset --repo "${{ github.repository }}" --clobber
        } else {
          gh release create $tag $asset --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Benefit v0.1.5 — 全局奖励模板与实机代码指纹" --notes $notes --prerelease
        }
