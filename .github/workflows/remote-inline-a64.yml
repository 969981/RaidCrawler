name: Offline Violet400 A64 code-patch checks
on:
  push:
    branches: [benefit]
    paths:
      - "native/sv_remote_code_patch/**"
      - "tools/research/audit_violet400_elf_readonly.py"
      - "tools/research/test_audit_violet400_elf_readonly.py"
      - "tools/research/audit_violet400_serializer_references.py"
      - "tools/research/test_audit_violet400_serializer_references.py"
      - "tools/research/audit_violet400_reward_source_bridges.py"
      - "tools/research/test_audit_violet400_reward_source_bridges.py"
      - "tools/research/verify_sv_reward_three_nodes.py"
      - "tools/research/test_verify_sv_reward_three_nodes.py"
      - ".github/workflows/remote-inline-a64.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-a64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm binutils
      - name: Run branch and reward validation tests
        run: python3 -m unittest discover -s native/sv_remote_code_patch -p 'test_*.py' -v
      - name: Read-only ELF audit selftests (ELF is not committed)
        run: python3 -m unittest discover -s tools/research -p 'test_audit_violet400_elf_readonly.py' -v
      - name: Read-only AArch64 serializer reference-scan selftests
        run: python3 -m unittest discover -s tools/research -p 'test_audit_violet400_serializer_references.py' -v
      - name: Read-only local reward source native-bridge selftests
        run: python3 -m unittest discover -s tools/research -p 'test_audit_violet400_reward_source_bridges.py' -v
      - name: Check pinned-source three-node verifier on non-game fixtures
        run: python3 -m unittest discover -s tools/research -p 'test_verify_sv_reward_three_nodes.py' -v
      - name: Cross-assemble 880-byte AArch64 proof only
        run: |
          clang --target=aarch64-none-elf -c native/sv_remote_code_patch/stub.S -o /tmp/raid_stub.o
          llvm-objcopy -j .text -O binary /tmp/raid_stub.o /tmp/raid_stub.bin
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/raid_stub.bin').read_bytes()
          assert len(b)==880
          import struct, hashlib, re
          assert b[0x8c:0x90]==bytes(4)  # B return relocation placeholder
          assert b[0x90:0x94]==(1).to_bytes(4,'little') # disarmed
          assert b[0x94:0xa0]==b'RHS2RaidPoin'
          assert b[0xa0:]==bytes(720)
          code=bytearray(b[:0x90])
          branch=0x14000000|(((0xE32988-(0x343FC90+0x8C))//4)&0x3ffffff)
          code[0x8c:0x90]=struct.pack('<I',branch)
          assert hashlib.sha256(code).hexdigest()=='7c54a5ca250a1683f5d41ad6dd8fc928d83c7e94494fdafd1e1da18cda9158b8'
          source=Path('RaidCrawler.Core/Structures/RemoteViolet400HookPayload.cs').read_text()
          fragment=source.split('private static readonly byte[] Code =')[1].split('private static readonly byte[] Marker')[0]
          literals=re.findall(r'"([0-9A-F]{32,})"',fragment)
          assert bytes.fromhex(''.join(literals))==code, 'WinForms embedded code differs from cross-assembled ELF stub'
          print('Violet400 880B v2 AArch64 code matches embedded Windows image')
          PY
