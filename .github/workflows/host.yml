name: RaidCrawler host (experimental)

on:
  push:
    branches: [host]
  pull_request:
    branches: [host]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout host source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RaidCrawler.slnx

      - name: Build
        run: dotnet build RaidCrawler.slnx -c Release --no-restore

      - name: Test (no Switch hardware)
        run: dotnet test RaidCrawler.Tests/RaidCrawler.Tests.csproj -c Release --no-build

      - name: Publish experimental WinForms app
        run: dotnet publish RaidCrawler.WinForms/RaidCrawler.WinForms.csproj -c Release -r win-x64 --self-contained false

      - name: Upload non-release test artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RaidCrawler-host-experimental
          path: RaidCrawler.WinForms/bin/x64/Release/net10.0-windows/win-x64/publish/
          if-no-files-found: error
          retention-days: 7
