name: RaidCrawler host (experimental)

on:
  push:
    branches: [host]
  pull_request:
    branches: [host]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - name: Checkout exact host commit
        uses: actions/checkout@v4
      - name: Build paired read-only Native and ASLR manifest
        run: HOST_N2_EXPERIMENTAL=0 bash switch/host-probe/build.sh
      - name: Upload paired native files
        uses: actions/upload-artifact@v4
        with:
          name: host-native-same-commit
          path: switch/host-probe/out/
          if-no-files-found: error
          retention-days: 7

  test-and-build:
    needs: native-pair
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout host source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: N1 offline snapshot parser tests (synthetic data)
        run: python tools/host/test_compare_capture.py

      - name: Violet ELF signature contract tests (without distributing ELF)
        run: python tools/host/test_elf_audit.py

      - name: Restore
        run: dotnet restore RaidCrawler.slnx

      - name: Build
        run: dotnet build RaidCrawler.slnx -c Release --no-restore

      - name: Test Host additions (blocking)
        run: dotnet test RaidCrawler.Tests/RaidCrawler.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~RaidCrawler.Tests.Host."

      # The unmodified upstream fixture tests currently fail in this environment.
      # Keep their output visible without conflating those failures with host changes.
      - name: Legacy suite diagnostic (non-blocking)
        continue-on-error: true
        run: dotnet test RaidCrawler.Tests/RaidCrawler.Tests.csproj -c Release --no-build --filter "FullyQualifiedName!~RaidCrawler.Tests.Host."

      - name: Publish experimental WinForms app
        run: dotnet publish RaidCrawler.WinForms/RaidCrawler.WinForms.csproj -c Release -r win-x64 --self-contained false

      - name: Download exact-commit read-only Native build
        uses: actions/download-artifact@v4
        with:
          name: host-native-same-commit
          path: paired-native

      - name: Bundle paired mailbox manifest and Switch module
        shell: pwsh
        run: |
          $publish = "RaidCrawler.WinForms/bin/Release/net10.0-windows/win-x64/publish"
          New-Item -ItemType Directory -Force -Path "$publish/Native" | Out-Null
          Copy-Item paired-native/mailbox-locator.json "$publish/mailbox-locator.json"
          Copy-Item paired-native/subsdk9 "$publish/Native/subsdk9"
          Copy-Item paired-native/main.npdm "$publish/Native/main.npdm"
          Copy-Item paired-native/SHA256SUMS.txt "$publish/Native/SHA256SUMS.txt"
          Copy-Item paired-native/INSTALL_NOT_AUTOMATIC.txt "$publish/Native/INSTALL_NOT_AUTOMATIC.txt"
          Write-Host "Matched Native + C# at commit $env:GITHUB_SHA"

      - name: Upload non-release test artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: RaidCrawler-host-experimental
          path: RaidCrawler.WinForms/bin/Release/net10.0-windows/win-x64/publish/
          if-no-files-found: error
          retention-days: 7
